modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/MarcosBrendonDePaula/mine-loader/issues"

[[mods]]
modId = "lua_loader"
version = "${version}"
displayName = "Minecraft Lua Loader"
description = '''
Nucleo de um modloader declarativo com mods JSON e logica Lua. Este e o adaptador NeoForge: o
mesmo nucleo do adaptador Fabric, sem uma linha diferente.
'''
authors = "Minecraft Lua Loader"

[[mixins]]
config = "lua_loader.neoforge.mixins.json"

[[dependencies.lua_loader]]
modId = "neoforge"
type = "required"
versionRange = "[21.4,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.lua_loader]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.4,1.21.5)"
ordering = "NONE"
side = "BOTH"
