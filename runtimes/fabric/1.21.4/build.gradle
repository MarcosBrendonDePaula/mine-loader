plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// Cada runtime é auto-contido: atualizar Minecraft aqui não altera nem mascara outra versão.
def runtime = [
        minecraft_version: '1.21.4',
        yarn_mappings: '1.21.4+build.8',
        loader_version: '0.19.4',
        fabric_api_version: '0.119.4+1.21.4'
]

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    // Servidor headless que executa os @GameTest e escreve um relatorio JUnit.
    runs {
        // Entra direto em um mundo, para nao repetir menu e carregamento a cada teste:
        //   ./gradlew runClient -Pmundo="New World"
        // Sem a propriedade, o cliente abre no menu como sempre.
        client {
            client()
            if (project.hasProperty('mundo')) {
                programArgs '--quickPlaySingleplayer', project.property('mundo').toString()
            }
        }

        gametest {
            server()
            name = "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest-results.xml"
            runDir "build/gametest"
        }
    }

    mods {
        "lua_loader" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    // Nucleo agnostico de plataforma; este modulo e o adaptador Fabric.
    implementation project(':core')
    include project(':core')
    minecraft "com.mojang:minecraft:${runtime.minecraft_version}"
    mappings "net.fabricmc:yarn:${runtime.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${runtime.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${runtime.fabric_api_version}"
    modImplementation "org.luaj:luaj-jse:${project.luaj_version}"
    include "org.luaj:luaj-jse:${project.luaj_version}"
    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def version = project.mod_version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    def projectName = project.archives_base_name
    inputs.property "projectName", projectName

    from(rootProject.file("LICENSE")) {
        rename { "${it}_${projectName}" }
    }
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}

/*
 * Leva os mods de exemplo para o mundo do GameTest.
 *
 * Sem isto a pasta e uma copia feita a mao alguma vez, e os testes rodam contra exemplos velhos --
 * o pior resultado possivel, porque passa e nao verificou o que esta no repositorio. Foi o que
 * aconteceu com o bloco de inventario: o teste procurava um bloco que so existia em examples/.
 *
 * Sync, e nao Copy: Copy acrescenta e nunca remove, entao um exemplo que sai do repositorio
 * continuava sendo carregado nos testes. Um mod fantasma que ninguem consegue achar no codigo e
 * pior que um mod faltando.
 */
tasks.register('sincronizaExemplosDoGametest', Sync) {
    from rootProject.file('examples')
    into layout.buildDirectory.dir('gametest/mods-lua')
}

tasks.named('runGametest') {
    dependsOn 'sincronizaExemplosDoGametest'
}

/*
 * Aponta cada exemplo de run/mods-lua para a pasta em examples/, em vez de copiar.
 *
 * O GameTest ja sincroniza a sua propria copia; o servidor e o cliente nao, e liam uma copia feita
 * a mao alguma vez. O resultado e o pior possivel: a bateria fica verde contra um script velho, e o
 * log diz que passou. Foi o que aconteceu nesta sessao -- um caso novo simplesmente nao existia
 * para o servidor, e o total de casos nao mudou.
 *
 * So mexe em pasta cujo nome existe em examples/: e reproduzivel por definicao, nada se perde ao
 * refazer. Mod instalado por link ou baixado fica intacto.
 *
 * Junction no Windows e link simbolico no resto, pela mesma razao de linkModsLua: junction nao pede
 * privilegio de administrador.
 */
tasks.register('linkExemplos') {
    description = 'Faz run/mods-lua/<exemplo> apontar para examples/<exemplo>.'
    group = 'lua loader'

    doLast {
        def destinoRaiz = file('run/mods-lua')
        destinoRaiz.mkdirs()
        def windows = System.getProperty('os.name').toLowerCase().contains('windows')

        rootProject.file('examples').listFiles()?.findAll { it.directory }?.each { exemplo ->
            def destino = new File(destinoRaiz, exemplo.name)

            // Ja e link: nada a fazer. E o estado desejado, e refazer so gastaria tempo.
            if (java.nio.file.Files.isSymbolicLink(destino.toPath())) return
            if (destino.exists() && windows && destino.canonicalPath == exemplo.canonicalPath) return

            if (destino.exists()) {
                delete destino
                println "Copia substituida por link: ${exemplo.name}"
            }

            if (windows) {
                // ProcessBuilder, e nao exec {}: o exec do projeto nao alcanca de dentro deste
                // closure aninhado, e a falha aparece so ao rodar a tarefa.
                def processo = new ProcessBuilder('cmd', '/c', 'mklink', '/J',
                        destino.absolutePath, exemplo.absolutePath).redirectErrorStream(true).start()
                def saida = processo.inputStream.text
                if (processo.waitFor() != 0) {
                    throw new GradleException("mklink falhou para ${exemplo.name}: ${saida}")
                }
            } else {
                java.nio.file.Files.createSymbolicLink(destino.toPath(), exemplo.toPath())
            }
        }
    }
}

tasks.matching { it.name in ['runServer', 'runClient'] }.configureEach {
    dependsOn 'linkExemplos'

    /*
     * Pastas de mod fora do jogo, para desenvolver um mod que mora em outro repositorio.
     *
     *   ./gradlew :runClient -Pmods=E:/logistica-lua/logistica
     *   MINE_LOADER_MODS=/caminho/do/mod ./gradlew :runClient
     *
     * Sem copiar nada para mods-lua. A copia era o que se fazia, e o servidor acabava rodando
     * contra um script velho dizendo que passou -- o pior resultado possivel, porque parece
     * verificacao.
     */
    def extras = project.findProperty('mods') ?: System.getenv('MINE_LOADER_MODS')
    if (extras) {
        systemProperty 'mineloader.mods', extras
        doFirst { println "Pastas de mod extras: ${extras}" }
    }
}
