name: Release

# Publica uma versao a partir de uma tag. Sao dois jars, um por plataforma, e o jogador baixa o da
# dele; os mods de exemplo vao a parte, porque sao pastas de dados e nao jars.
#
# Os mods de exemplo servem as duas plataformas sem mudanca: e a mesma pasta, o mesmo manifesto e o
# mesmo Lua. E o que a separacao entre nucleo e adaptador existe para permitir.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versao a publicar, por exemplo v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publicar versao
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v4

      - name: Preparar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar e rodar os testes
        # Uma versao so e publicada se os testes passarem.
        run: ./gradlew build --stacktrace

      - name: Compilar o adaptador NeoForge
        run: ./gradlew :neoforge:build --stacktrace

      - name: Reunir os jars das duas plataformas
        # Renomeia para o nome dizer a plataforma: os dois se chamariam igual na pagina da release.
        run: |
          mkdir -p build/plataformas
          versao="${{ github.event_name == 'workflow_dispatch'
                       && github.event.inputs.versao || github.ref_name }}"

          for jar in build/libs/*.jar; do
            case "$jar" in *sources*|*dev*) continue;; esac
            cp "$jar" "build/plataformas/minecraft-lua-loader-fabric-${versao}.jar"
          done

          for jar in neoforge/build/libs/*.jar; do
            case "$jar" in *sources*|*dev*) continue;; esac
            cp "$jar" "build/plataformas/minecraft-lua-loader-neoforge-${versao}.jar"
          done

          ls -la build/plataformas

      - name: Empacotar os mods de exemplo
        # Cada exemplo vira um zip proprio, para o jogador baixar so o que quer e descompactar
        # dentro de mods-lua/.
        run: |
          mkdir -p build/distribuicao
          for pasta in examples/*/; do
            nome=$(basename "$pasta")
            (cd examples && zip -r "../build/distribuicao/${nome}.zip" "$nome" -x '*/.*')
          done
          ls -la build/distribuicao

      - name: Descobrir a versao
        id: versao
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.versao }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          name: Mine Loader ${{ steps.versao.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Instalacao

            Escolha o jar da sua plataforma. Os mods de exemplo servem as duas sem mudanca.

            **Fabric** -- instale o Fabric Loader para 1.21.1 e a Fabric API, e ponha
            `minecraft-lua-loader-fabric-*.jar` em `mods/`.

            **NeoForge** -- instale o NeoForge 21.1 e ponha
            `minecraft-lua-loader-neoforge-*.jar` em `mods/`.

            Depois, baixe um mod de exemplo abaixo e descompacte em `mods-lua/`, ao lado de `mods/`.

            O jar precisa estar no cliente e no servidor. As telas desenhadas exigem o loader no
            cliente; a janela de itens funciona em cliente vanilla.

            ## Diferenca entre as plataformas

            O adaptador Fabric e o completo. O do NeoForge cobre o caminho central -- descobrir
            mods, executar Lua, ler e mexer no mundo e em inventarios -- e recusa com mensagem
            clara o que ainda nao implementa, em vez de responder errado. Blocos declarativos,
            telas desenhadas e receitas so existem no Fabric por enquanto.

            ## Mods de exemplo

            | Pacote | O que demonstra |
            |---|---|
            | `hello_lua` | Bloco com variantes, receitas, comando |
            | `crystal_world` | Estrutura declarada, dados por bloco, menu |
            | `guilda` | Missoes com progresso persistido |
            | `loja` | Interface minima de itens |
            | `painel` | Tela desenhada e HUD |
            | `github_mod` | Mod servido por URL |
          files: |
            build/plataformas/*.jar
            build/distribuicao/*.zip
