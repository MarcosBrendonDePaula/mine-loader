name: Release

# Publica uma versao a partir de uma tag. Há um jar por plataforma e versão do Minecraft; os
# mods de exemplo vao a parte, porque sao pastas de dados e nao jars.
#
# Os mods de exemplo servem as duas plataformas sem mudanca: e a mesma pasta, o mesmo manifesto e o
# mesmo Lua. E o que a separacao entre nucleo e adaptador existe para permitir.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versao a publicar, por exemplo v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publicar versao
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v4

      - name: Preparar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar e rodar os testes
        # Uma versao so e publicada se os quatro runtimes passarem.
        run: ./gradlew buildAllRuntimes testAllRuntimes gameTestAllRuntimes --stacktrace

      - name: Reunir os jars das duas plataformas
        # Renomeia para o nome dizer a plataforma: os dois se chamariam igual na pagina da release.
        run: |
          mkdir -p build/plataformas
          versao="${{ github.event_name == 'workflow_dispatch'
                       && github.event.inputs.versao || github.ref_name }}"

          for plataforma in fabric neoforge; do
            for pasta in "runtimes/${plataforma}"/*; do
              versao_mc=$(basename "$pasta")
              for jar in "$pasta"/build/libs/*.jar; do
                [ -f "$jar" ] || continue
                case "$jar" in *sources*|*dev*) continue;; esac
                cp "$jar" "build/plataformas/minecraft-lua-loader-${plataforma}-${versao_mc}-${versao}.jar"
              done
            done
          done

          ls -la build/plataformas

      - name: Empacotar os mods de exemplo
        # Cada exemplo vira um zip proprio, para o jogador baixar so o que quer e descompactar
        # dentro de mods-lua/.
        run: |
          mkdir -p build/distribuicao
          for pasta in examples/*/; do
            nome=$(basename "$pasta")
            (cd examples && zip -r "../build/distribuicao/${nome}.zip" "$nome" -x '*/.*')
          done
          ls -la build/distribuicao

      - name: Descobrir a versao
        id: versao
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.versao }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          name: Mine Loader ${{ steps.versao.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Instalacao

            Escolha o jar da sua plataforma. Os mods de exemplo servem as duas sem mudanca.

            **Fabric** -- instale o Fabric Loader e a Fabric API correspondentes à versão do Minecraft,
            e ponha o jar `fabric-<versao>/` em `mods/`.

            **NeoForge** -- instale a versão NeoForge correspondente e ponha o jar
            `neoforge-<versao>/` em `mods/`.

            Depois, baixe um mod de exemplo abaixo e descompacte em `mods-lua/`, ao lado de `mods/`.

            O jar precisa estar no cliente e no servidor. As telas desenhadas exigem o loader no
            cliente; a janela de itens funciona em cliente vanilla.

            ## Diferenca entre as plataformas

            Os dois adaptadores cobrem o mesmo caminho: descobrir mods, executar Lua, registrar
            blocos e itens, montar o pacote de recursos, desenhar telas, mexer no mundo e em
            inventarios. A bateria de GameTests roda nas duas em todo push, e e de proposito --
            enquanto ela rodava so no Fabric, seis divergencias entre os adaptadores se
            acumularam sem quebrar nada.

            O que ainda difere esta em `docs/COMPATIBILIDADE.md`, conferido a cada mudanca. Uma
            matriz que envelhece em silencio e pior que nenhuma, porque alguem confia nela.

            ## Defeito conhecido nesta versao

            **Modelo `.obj` desenha errado no Fabric.** Um bloco com malha propria aparece
            correto no NeoForge e deformado no Fabric. O leitor do `.obj` mora no nucleo e e o
            mesmo nas duas; o que diverge e o desenho -- as contas de oclusao de ambiente e de
            sombreamento difuso do Fabric supoem a face encostada na parede do cubo, e numa malha
            ela fica no meio do bloco.

            Vale so para mods que declaram `render.model` com um `.obj`. Bloco comum, item,
            tela, receita e o resto nao sao afetados. O diagnostico completo esta em
            `docs/COMPATIBILIDADE.md`, na secao "A malha desenha errado no Fabric".

            ## Mods de exemplo

            | Pacote | O que demonstra |
            |---|---|
            | `hello_lua` | Bloco com variantes, receitas, comando |
            | `crystal_world` | Estrutura declarada, dados por bloco, menu |
            | `guilda` | Missoes com progresso persistido |
            | `loja` | Interface minima de itens |
            | `painel` | Tela desenhada e HUD |
            | `github_mod` | Mod servido por URL |
          files: |
            build/plataformas/*.jar
            build/distribuicao/*.zip
