name: CI

# Roda em todo push e pull request: o build compila o nucleo e os dois adaptadores -- Fabric e
# NeoForge -- e executa os testes unitarios mais os GameTests, que sobem um servidor headless.
#
# O adaptador NeoForge compila em um passo proprio porque ele baixa outro Minecraft, e uma falha ali
# precisa aparecer como falha dele, e nao confundida com a do Fabric.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # Um push novo na mesma referencia cancela a execucao anterior, que ja esta obsoleta.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v4

      - name: Preparar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar e rodar os testes
        run: ./gradlew build --stacktrace

      - name: Compilar o adaptador NeoForge
        # Prova que o nucleo nao depende de plataforma: o mesmo core, outra casa.
        run: ./gradlew :neoforge:build --stacktrace

      - name: Aceitar o EULA para os GameTests
        # Os GameTests sobem um servidor de verdade, que exige o EULA aceito.
        run: |
          mkdir -p build/gametest
          echo "eula=true" > build/gametest/eula.txt

      - name: Instalar os mods de exemplo para os GameTests
        run: |
          mkdir -p build/gametest/mods-lua
          cp -r examples/hello_lua build/gametest/mods-lua/
          cp -r examples/crystal_world build/gametest/mods-lua/

      - name: Rodar os GameTests do Fabric
        run: ./gradlew runGametest --stacktrace

      - name: Aceitar o EULA para os GameTests do NeoForge
        run: |
          mkdir -p neoforge/build/gametest
          echo "eula=true" > neoforge/build/gametest/eula.txt

      - name: Rodar os GameTests do NeoForge
        # As duas plataformas, e nao so uma: enquanto isto nao rodava aqui, seis divergencias
        # entre os adaptadores se acumularam sem quebrar nenhum teste -- eventos que nunca
        # disparavam, receitas que nao chegavam ao servidor, ferramentas que viravam item comum.
        run: ./gradlew :neoforge:runGameTestServer --stacktrace

      - name: Guardar os relatorios quando algo falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            core/build/reports/tests/
            core/build/test-results/
            build/gametest-results.xml
          retention-days: 7

      - name: Publicar o jar do Fabric
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-lua-loader-fabric
          path: build/libs/*.jar
          retention-days: 14

      - name: Publicar o jar do NeoForge
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-lua-loader-neoforge
          path: neoforge/build/libs/*.jar
          retention-days: 14
