name: CI

# Roda em todo push e pull request: o build compila o nucleo e os quatro runtimes -- duas
# plataformas em duas versões -- e executa testes unitários mais GameTests headless.
#
# O adaptador NeoForge compila em um passo proprio porque ele baixa outro Minecraft, e uma falha ali
# precisa aparecer como falha dele, e nao confundida com a do Fabric.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # Um push novo na mesma referencia cancela a execucao anterior, que ja esta obsoleta.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v4

      - name: Preparar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar e rodar os testes unitários
        run: ./gradlew buildAllRuntimes testAllRuntimes --stacktrace

      - name: Rodar os GameTests em todos os runtimes
        # Cada bridge sincroniza examples/ para o próprio diretório e sobe o seu servidor headless.
        run: ./gradlew gameTestAllRuntimes --stacktrace

      - name: Guardar os relatorios quando algo falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            core/build/reports/tests/
            core/build/test-results/
            runtimes/**/build/gametest-results.xml
          retention-days: 7

      - name: Publicar o jar do Fabric
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-lua-loader-fabric
          path: runtimes/fabric/*/build/libs/*.jar
          retention-days: 14

      - name: Publicar o jar do NeoForge
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-lua-loader-neoforge
          path: runtimes/neoforge/*/build/libs/*.jar
          retention-days: 14
