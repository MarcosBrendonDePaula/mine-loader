pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'minecraft-lua-loader'

// O núcleo é independente da plataforma. Cada runtime fica isolado por plataforma e versão,
// permitindo que a mesma API seja validada contra vários Minecraft sem duplicar o core.
include 'core'
include 'runtimes:fabric:1.21.1'
include 'runtimes:fabric:1.21.4'
include 'runtimes:neoforge:1.21.1'
include 'runtimes:neoforge:1.21.4'

project(':runtimes:fabric:1.21.1').projectDir = file('runtimes/fabric/1.21.1')
project(':runtimes:fabric:1.21.4').projectDir = file('runtimes/fabric/1.21.4')
project(':runtimes:neoforge:1.21.1').projectDir = file('runtimes/neoforge/1.21.1')
project(':runtimes:neoforge:1.21.4').projectDir = file('runtimes/neoforge/1.21.4')
