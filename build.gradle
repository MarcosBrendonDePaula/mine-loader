plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    // Servidor headless que executa os @GameTest e escreve um relatorio JUnit.
    runs {
        // Entra direto em um mundo, para nao repetir menu e carregamento a cada teste:
        //   ./gradlew runClient -Pmundo="New World"
        // Sem a propriedade, o cliente abre no menu como sempre.
        client {
            client()
            if (project.hasProperty('mundo')) {
                programArgs '--quickPlaySingleplayer', project.property('mundo').toString()
            }
        }

        gametest {
            server()
            name = "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest-results.xml"
            runDir "build/gametest"
        }
    }

    mods {
        "lua_loader" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    // Nucleo agnostico de plataforma; este modulo e o adaptador Fabric.
    implementation project(':core')
    include project(':core')
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "org.luaj:luaj-jse:${project.luaj_version}"
    include "org.luaj:luaj-jse:${project.luaj_version}"
    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def version = project.mod_version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    def projectName = project.archives_base_name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_${projectName}" }
    }
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}

/*
 * Leva os mods de exemplo para o mundo do GameTest.
 *
 * Sem isto a pasta e uma copia feita a mao alguma vez, e os testes rodam contra exemplos velhos --
 * o pior resultado possivel, porque passa e nao verificou o que esta no repositorio. Foi o que
 * aconteceu com o bloco de inventario: o teste procurava um bloco que so existia em examples/.
 */
tasks.register('sincronizaExemplosDoGametest', Copy) {
    from 'examples'
    into layout.buildDirectory.dir('gametest/mods-lua')
}

tasks.named('runGametest') {
    dependsOn 'sincronizaExemplosDoGametest'
}
