plugins {
    id 'base'
}

// O projeto raiz não conhece classes de Minecraft. Ele apenas orquestra o core e os adaptadores.

allprojects {
    group = findProperty('maven_group') ?: 'dev.lualoader'
    version = findProperty('mod_version') ?: '0.1.0'
}

tasks.register('testAllRuntimes') {
    group = 'verification'
    description = 'Executa o core e os testes de todos os runtimes versionados.'
    dependsOn(
            ':core:test',
            ':runtimes:fabric:1.21.1:test',
            ':runtimes:fabric:1.21.4:test',
            ':runtimes:neoforge:1.21.1:test',
            ':runtimes:neoforge:1.21.4:test')
}

tasks.register('compileAllRuntimes') {
    group = 'verification'
    description = 'Compila todos os runtimes versionados.'
    dependsOn(
            ':core:classes',
            ':runtimes:fabric:1.21.1:compileJava',
            ':runtimes:fabric:1.21.4:compileJava',
            ':runtimes:neoforge:1.21.1:compileJava',
            ':runtimes:neoforge:1.21.4:compileJava')
}

tasks.register('buildAllRuntimes') {
    group = 'build'
    description = 'Compila e empacota o core e todos os runtimes versionados.'
    dependsOn(
            ':core:build',
            ':runtimes:fabric:1.21.1:build',
            ':runtimes:fabric:1.21.4:build',
            ':runtimes:neoforge:1.21.1:build',
            ':runtimes:neoforge:1.21.4:build')
}

tasks.register('gameTestAllRuntimes') {
    group = 'verification'
    description = 'Executa os GameTests no Fabric e NeoForge para cada versão do Minecraft.'
    dependsOn(
            ':runtimes:fabric:1.21.1:runGametest',
            ':runtimes:fabric:1.21.4:runGametest',
            ':runtimes:neoforge:1.21.1:runGameTestServer',
            ':runtimes:neoforge:1.21.4:runGameTestServer')
}

tasks.register('checkAllRuntimes') {
    group = 'verification'
    description = 'Executa todas as verificações do core e dos runtimes.'
    dependsOn(
            ':core:check',
            'gameTestAllRuntimes',
            ':runtimes:fabric:1.21.1:check',
            ':runtimes:fabric:1.21.4:check',
            ':runtimes:neoforge:1.21.1:check',
            ':runtimes:neoforge:1.21.4:check')
}
